# Staging continuous deployment (SPECIFICATIONS.md §5.5, §59–§60).
#
# Pipeline: CI (gate) → Build → Security scan → Infrastructure plan → Deploy → Smoke
# Authenticates with GitHub Actions OIDC only. Application secrets stay in AWS Secrets Manager
# (Terraform-generated JWT/DB/Redis; optional extras via Environment secret TF_VAR_extra_secret_values).
name: CD · staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  UV_VERSION: "0.12.17"
  TERRAFORM_VERSION: "1.16.3"
  TRIVY_VERSION: "v0.74.0"
  NEXT_TELEMETRY_DISABLED: "1"
  DOCULENS_STATIC_EXPORT: "1"
  # Prefer the commit that passed CI when triggered by workflow_run.
  CHECKOUT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  ci_gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require green CI on main
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CHECKOUT_SHA: ${{ env.CHECKOUT_REF }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — verifying CI success for ${CHECKOUT_SHA}"
            # Require a successful CI workflow run for this commit (no silent bypass).
            conclusion="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${CHECKOUT_SHA}&per_page=5" \
              --jq '[.workflow_runs[] | select(.conclusion != null)] | first | .conclusion // "missing"')"
            if [ "${conclusion}" != "success" ]; then
              echo "CI conclusion for ${CHECKOUT_SHA} is '${conclusion}'; refusing staging deploy." >&2
              exit 1
            fi
            echo "CI succeeded for dispatch ref; continuing."
            exit 0
          fi
          if [ "${CONCLUSION}" != "success" ]; then
            echo "CI did not succeed (conclusion=${CONCLUSION}); refusing staging deploy." >&2
            exit 1
          fi
          echo "CI succeeded; continuing staging pipeline."

  build:
    name: Build · images and frontend
    needs: ci_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Image tag
        id: meta
        run: |
          set -euo pipefail
          TAG="sha-$(echo '${{ env.CHECKOUT_REF }}' | cut -c1-40)"
          echo "image_tag=${TAG}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t "doculens-api:${{ steps.meta.outputs.image_tag }}" .
      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t "doculens-worker:${{ steps.meta.outputs.image_tag }}" .
      - name: Save images
        run: |
          set -euo pipefail
          mkdir -p .local/cd
          docker save "doculens-api:${{ steps.meta.outputs.image_tag }}" | gzip > .local/cd/api.tar.gz
          docker save "doculens-worker:${{ steps.meta.outputs.image_tag }}" | gzip > .local/cd/worker.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-images-${{ steps.meta.outputs.image_tag }}
          path: .local/cd/*.tar.gz
          retention-days: 3

  security_scan:
    name: Security scan · container images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-images-${{ needs.build.outputs.image_tag }}
          path: .local/cd
      - name: Load images
        run: |
          set -euo pipefail
          gunzip -c .local/cd/api.tar.gz | docker load
          gunzip -c .local/cd/worker.tar.gz | docker load
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: doculens-api:${{ needs.build.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          cache-dir: ${{ github.workspace }}/.cache/trivy
      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: doculens-worker:${{ needs.build.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          cache-dir: ${{ github.workspace }}/.cache/trivy

  infra_plan:
    name: Infrastructure plan
    needs: ci_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Require CD configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          for name in ROLE_ARN TF_STATE_BUCKET TF_LOCK_TABLE; do
            eval "value=\${${name}}"
            if [ -z "${value}" ]; then
              echo "Missing GitHub Environment variable ${name} on staging." >&2
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: doculens-cd-staging-plan-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Write staging tfvars (no secrets)
        env:
          CHROMA_URL: ${{ vars.CHROMA_URL }}
          CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS }}
        run: |
          set -euo pipefail
          if [[ -z "${CHROMA_URL:-}" || "${CHROMA_URL}" == *"chroma.example"* ]]; then
            echo "Set GitHub Environment variable CHROMA_URL to a real https:// Chroma endpoint (OQ-1)." >&2
            exit 1
          fi
          if [[ ! "${CHROMA_URL}" =~ ^https:// ]]; then
            echo "CHROMA_URL must use https://" >&2
            exit 1
          fi
          CORS_LINE=""
          if [[ -n "${CORS_ALLOW_ORIGINS:-}" ]]; then
            # Comma-separated origins → Terraform list.
            IFS=',' read -r -a ORIGINS <<< "${CORS_ALLOW_ORIGINS}"
            QUOTED=""
            for o in "${ORIGINS[@]}"; do
              o="$(echo "${o}" | xargs)"
              [[ -z "${o}" ]] && continue
              QUOTED="${QUOTED}${QUOTED:+, }\"${o}\""
            done
            if [[ -n "${QUOTED}" ]]; then
              CORS_LINE="cors_allow_origins = [${QUOTED}]"
            fi
          fi
          cat > infrastructure/terraform/envs/staging/terraform.tfvars <<EOF
          aws_region                  = "${{ env.AWS_REGION }}"
          chroma_url                  = "${CHROMA_URL}"
          create_github_oidc_provider = false
          create_github_deploy_role   = true
          github_repository           = "${{ github.repository }}"
          enable_interface_endpoints  = false
          enable_vpc_flow_logs        = true
          ${CORS_LINE}
          EOF
      - name: Plan
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          # Optional map JSON from Environment *secret* — never a repository file.
          TF_VAR_extra_secret_values: ${{ secrets.TF_VAR_EXTRA_SECRET_VALUES }}
        run: |
          set -euo pipefail
          chmod +x scripts/cd/plan_staging.sh
          mkdir -p .local
          ./scripts/cd/plan_staging.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-tfplan-${{ env.CHECKOUT_REF }}
          path: |
            .local/staging.tfplan.txt
            infrastructure/terraform/envs/staging/terraform.tfvars
          retention-days: 7
          # Binary .tfplan is intentionally omitted: it can embed TF_VAR_extra_secret_values.

  deploy:
    name: Deploy · staging
    needs: [build, security_scan, infra_plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
      frontend_url: ${{ steps.deploy.outputs.frontend_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-images-${{ needs.build.outputs.image_tag }}
          path: .local/cd
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: doculens-cd-staging-deploy-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.1.7
        id: ecr
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Load images
        run: |
          set -euo pipefail
          gunzip -c .local/cd/api.tar.gz | docker load
          gunzip -c .local/cd/worker.tar.gz | docker load
      - name: Write staging tfvars (no secrets)
        env:
          CHROMA_URL: ${{ vars.CHROMA_URL }}
          CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS }}
        run: |
          set -euo pipefail
          if [[ -z "${CHROMA_URL:-}" || "${CHROMA_URL}" == *"chroma.example"* ]]; then
            echo "Set GitHub Environment variable CHROMA_URL to a real https:// Chroma endpoint (OQ-1)." >&2
            exit 1
          fi
          if [[ ! "${CHROMA_URL}" =~ ^https:// ]]; then
            echo "CHROMA_URL must use https://" >&2
            exit 1
          fi
          CORS_LINE=""
          if [[ -n "${CORS_ALLOW_ORIGINS:-}" ]]; then
            # Comma-separated origins → Terraform list.
            IFS=',' read -r -a ORIGINS <<< "${CORS_ALLOW_ORIGINS}"
            QUOTED=""
            for o in "${ORIGINS[@]}"; do
              o="$(echo "${o}" | xargs)"
              [[ -z "${o}" ]] && continue
              QUOTED="${QUOTED}${QUOTED:+, }\"${o}\""
            done
            if [[ -n "${QUOTED}" ]]; then
              CORS_LINE="cors_allow_origins = [${QUOTED}]"
            fi
          fi
          cat > infrastructure/terraform/envs/staging/terraform.tfvars <<EOF
          aws_region                  = "${{ env.AWS_REGION }}"
          chroma_url                  = "${CHROMA_URL}"
          create_github_oidc_provider = false
          create_github_deploy_role   = true
          github_repository           = "${{ github.repository }}"
          enable_interface_endpoints  = false
          enable_vpc_flow_logs        = true
          ${CORS_LINE}
          EOF
      - name: Deploy backend, worker, frontend, infrastructure
        id: deploy
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          TF_VAR_extra_secret_values: ${{ secrets.TF_VAR_EXTRA_SECRET_VALUES }}
        run: |
          set -euo pipefail
          chmod +x scripts/cd/deploy_staging.sh
          mkdir -p .local
          # Retag scanned artifact images — deploy must push these digests, not rebuild.
          docker tag "doculens-api:${IMAGE_TAG}" "${ECR_REGISTRY}/doculens-staging-api:${IMAGE_TAG}"
          docker tag "doculens-worker:${IMAGE_TAG}" "${ECR_REGISTRY}/doculens-staging-worker:${IMAGE_TAG}"
          SKIP_IMAGE_BUILD=1 ./scripts/cd/deploy_staging.sh
          # shellcheck disable=SC1091
          source .local/staging-deploy.env
          {
            echo "api_url=${API_URL}"
            echo "frontend_url=${FRONTEND_URL}"
          } >> "${GITHUB_OUTPUT}"

  smoke:
    name: Smoke tests
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            .python-version
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Staging functional smoke
        env:
          API_URL: ${{ needs.deploy.outputs.api_url }}
          FRONTEND_URL: ${{ needs.deploy.outputs.frontend_url }}
        run: |
          set -euo pipefail
          chmod +x scripts/cd/smoke_staging.sh
          ./scripts/cd/smoke_staging.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Playwright browsers
        run: pnpm --filter @doculens/web exec playwright install --with-deps chromium
      - name: Frontend UI smoke against staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.frontend_url }}
        run: pnpm --filter @doculens/web exec playwright test --project=smoke
