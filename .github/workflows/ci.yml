# Continuous integration (SPECIFICATIONS.md §59): every pull request and push to main must pass
# formatting, lint, type checks, unit/API tests, frontend tests, builds, security checks and
# infrastructure validation. Actions are pinned to commit SHAs; the comment records the tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.17"
  UV_FROZEN: "1" # every uv command uses uv.lock as-is; a stale lockfile fails instead of re-resolving
  TERRAFORM_VERSION: "1.16.3"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python:
    name: Python · format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install workspace
        run: uv sync --frozen
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: RAG evaluation
        run: uv run python -m evals
      - name: Upload RAG evaluation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rag-eval-results
          path: docs/eval/latest.json
          if-no-files-found: warn
      - name: Documentation links
        run: uv run python scripts/check_doc_links.py

  web:
    name: Web · format, lint, types, unit, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test:web
      - name: Build
        run: pnpm run build
      - name: Install Playwright browsers
        run: pnpm --filter @doculens/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  e2e-critical:
    name: Web · critical Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Install Node workspace
        run: pnpm install --frozen-lockfile
      - name: Write critical-e2e environment
        run: uv run python scripts/write_critical_e2e_env.py
      - name: Start infrastructure
        run: |
          docker compose --project-directory . -f docker/compose.yaml up --detach --wait postgres redis chroma
      - name: Apply database migrations
        run: uv run alembic -c packages/core/alembic.ini upgrade head
      - name: Start API
        run: |
          mkdir -p .local/storage-e2e
          nohup uv run uvicorn doculens_api.main:create_app --factory --host 127.0.0.1 --port 8000 \
            > /tmp/doculens-api.log 2>&1 &
          echo $! > /tmp/doculens-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready" >&2
          cat /tmp/doculens-api.log >&2 || true
          exit 1
      - name: Start document worker
        run: |
          nohup uv run python -m doculens_worker > /tmp/doculens-worker.log 2>&1 &
          echo $! > /tmp/doculens-worker.pid
      - name: Build web app for API
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm run build
      - name: Install Playwright browsers
        run: pnpm --filter @doculens/web exec playwright install --with-deps chromium
      - name: Critical end-to-end tests
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          CI: "true"
        run: pnpm run test:e2e:critical
      - name: Upload critical Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-critical
          path: apps/web/playwright-report
          retention-days: 7
      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "===== API ====="
          cat /tmp/doculens-api.log || true
          echo "===== Worker ====="
          cat /tmp/doculens-worker.log || true
      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/doculens-api.pid ]; then kill "$(cat /tmp/doculens-api.pid)" || true; fi
          if [ -f /tmp/doculens-worker.pid ]; then kill "$(cat /tmp/doculens-worker.pid)" || true; fi
          docker compose --project-directory . -f docker/compose.yaml down --volumes || true

  docker:
    name: Docker · build and scan images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: doculens-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Scan ${{ matrix.image }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: doculens-${{ matrix.image }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM

  security:
    name: Security · secrets and dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Python dependency audit
        run: |
          uv export --frozen --no-dev --all-packages --no-emit-workspace \
            --format requirements-txt --output-file requirements-audit.txt
          uvx pip-audit==2.10.1 --strict --requirement requirements-audit.txt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: npm dependency audit
        run: pnpm audit --prod --audit-level moderate

  terraform:
    name: Terraform · format and validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    defaults:
      run:
        working-directory: infrastructure/terraform/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive ../..
      - name: Init (no backend)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
