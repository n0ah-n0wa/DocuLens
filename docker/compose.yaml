# Local infrastructure for development and integration tests (SPECIFICATIONS.md §87).
# Ports are bound to the loopback interface only so that development services are never reachable
# from the local network. Run from the repository root so that `.env` is picked up:
#   docker compose --project-directory . -f docker/compose.yaml up --detach --wait
#
# MinIO provides the S3-compatible object store (docs/decisions/ADR-014-object-storage.md).
# `minio-init` (profile `init`, run by `make infra-up`) creates the documents bucket and exits:
#   docker compose --project-directory . -f docker/compose.yaml run --rm minio-init

name: doculens

services:
  postgres:
    # Digest-pinned so local infra does not float when the tag is rebuilt.
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doculens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doculens-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-doculens}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Official MinIO Hub/Quay images are no longer anonymously pullable; Chainguard hosts a
    # public maintained build (ADR-014). Digest-pinned so CI does not float on :latest.
    # Runs as root in compose so the named volume (often root-owned from the previous
    # quay.io image) stays writable; testcontainers uses the image default nonroot user.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    user: "0:0"
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-doculens}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-doculens-local-only}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc ready local',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-doculens}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-doculens-local-only}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-doculens-documents}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"

volumes:
  postgres-data:
  chroma-data:
  minio-data:
