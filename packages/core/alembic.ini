# Alembic configuration for the DocuLens schema (SPECIFICATIONS.md §45).
# Run from the repository root:  uv run alembic -c packages/core/alembic.ini upgrade head
# The database URL comes from DATABASE_URL (see .env.example) or `-x database_url=...`.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
