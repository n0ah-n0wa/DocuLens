[project]
name = "doculens-core"
version = "0.1.0"
description = "DocuLens core: domain, application and infrastructure layers, independent of any web framework."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "boto3==1.43.103",
    "chromadb-client==1.5.9",
    "httpx==0.28.1",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-semantic-conventions==0.66b0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.0",
    "pymupdf==1.28.2",
    "redis==6.4.0",
    "sqlalchemy[asyncio]==2.0.54",
    "structlog==26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doculens"
