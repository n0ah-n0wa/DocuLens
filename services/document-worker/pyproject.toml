[project]
name = "doculens-worker"
version = "0.1.0"
description = "DocuLens document-processing worker: the queue-driven interface layer over doculens-core."
requires-python = ">=3.12"
dependencies = [
  "doculens-core",
]

[project.scripts]
doculens-worker = "doculens_worker.entrypoint:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doculens_worker"
